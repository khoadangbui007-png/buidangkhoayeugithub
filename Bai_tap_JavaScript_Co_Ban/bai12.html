<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuong Trinh Kiem Tra Nam Nhuan</h2>
    <label>Nhập một năm:</label>
    <input type="number" id="nam">
    <br><br>
    <button onclick="nhuan()">Kiểm tra</button>
    <p id="ketqua"></p>

    <script>
        function nhuan() {
            let y = parseInt(document.getElementById("nam").value);
            let isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
            let kq = isLeap ? y + " là năm nhuận" : y + " không phải năm nhuận";
            document.getElementById("ketqua").innerHTML = kq;
        }
    </script>
</body>
</html>
