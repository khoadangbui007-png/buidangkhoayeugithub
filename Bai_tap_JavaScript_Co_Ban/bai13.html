<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuong Trinh Chuyen Doi Nhiet Do</h2>
    <label>Nhập nhiệt độ °C:</label>
    <input type="number" id="doC">
    <br><br>
    <button onclick="convert()">Chuyển đổi</button>
    <p id="ketqua"></p>

    <script>
        function convert() {
            let c = parseFloat(document.getElementById("doC").value);
            let f = (9 / 5) * c + 32;
            document.getElementById("ketqua").innerHTML = "Nhiệt độ °F: " + f.toFixed(2);
        }
    </script>
</body>
</html>
