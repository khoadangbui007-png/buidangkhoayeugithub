<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tro Choi Oan Tu Ti</h2>
    <button onclick="choi('Đá')">Đá</button>
    <button onclick="choi('Giấy')">Giấy</button>
    <button onclick="choi('Kéo')">Kéo</button>
    <p id="ketqua"></p>

    <script>
        function choi(user) {
            let arr = ['Đá', 'Giấy', 'Kéo'];
            let comp = arr[Math.floor(Math.random() * 3)];
            let kq = "Bạn chọn: " + user + " | Máy chọn: " + comp + " -> ";
            if (user === comp) kq += "Hòa!";
            else if ((user === 'Đá' && comp === 'Kéo') || (user === 'Giấy' && comp === 'Đá') || (user === 'Kéo' && comp === 'Giấy')) kq += "Bạn thắng!";
            else kq += "Bạn thua!";
            document.getElementById("ketqua").innerHTML = kq;
        }
    </script>
</body>
</html>
