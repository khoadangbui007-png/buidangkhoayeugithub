<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuong trinh bat / tat bonng den</h2>
    <!-- Đã sửa id="bulb" để khớp với JavaScript -->
    <img id="bulb" width="120px" src="./bulboff.gif" alt="light"> 
    <br><br>
    <button onclick="toggleLight()"> on / off </button>

    <script>
    function toggleLight() {
        let toggle = document.getElementById("bulb");
        // Kiểm tra nếu đang là ảnh tắt (bulboff.gif) thì đổi sang ảnh bật (bulbon.gif)
        if (toggle.src.includes("bulboff.gif")) {
            toggle.src = "./bulbon.gif";
        } else {
            toggle.src = "./bulboff.gif";
        }
    }
    </script>
</body>
</html>
