<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuong Trinh Tinh Chi So BMI</h2>
    <label>Chiều cao (m):</label> <input type="text" id="chieucao"><br><br>
    <label>Cân nặng (kg):</label> <input type="text" id="cannang"><br><br>
    <button onclick="tinhBMI()">Tính BMI</button>
    <p id="ketqua"></p>

    <script>
        function tinhBMI() {
            let h = parseFloat(document.getElementById("chieucao").value);
            let w = parseFloat(document.getElementById("cannang").value);
            
            if (isNaN(h) || isNaN(w) || h <= 0 || w <= 0) {
                document.getElementById("ketqua").innerHTML = "Vui lòng nhập đúng số liệu!";
                return;
            }

            let bmi = w / (h * h);
            let text = "";
            if (bmi < 18.5) text = "Gầy";
            else if (bmi < 25) text = "Bình thường";
            else if (bmi < 30) text = "Thừa cân";
            else text = "Béo phì";
            
            document.getElementById("ketqua").innerHTML = "BMI = " + bmi.toFixed(2) + " (" + text + ")";
        }
    </script>
</body>
</html>
