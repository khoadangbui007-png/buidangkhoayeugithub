<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuong Trinh Xep Loai Hoc Luc</h2>
    <label>Nhập điểm (0-100):</label>
    <input type="number" id="diem">
    <br><br>
    <button onclick="xeploai()">Xep Loai</button>
    <p id="ketqua"></p>

    <script>
        function xeploai() {
            let s = document.getElementById("diem").value;
            let kq = "";
            if (s >= 90) kq = "Xep loai: A";
            else if (s >= 80) kq = "Xep loai: B";
            else if (s >= 70) kq = "Xep loai: C";
            else if (s >= 60) kq = "Xep loai: D";
            else kq = "Xep loai: F";
            document.getElementById("ketqua").innerHTML = kq;
        }
    </script>
</body>
</html>
