<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuong Trinh Doan So May Man</h2>
    <label>Nhập số (1-10):</label>
    <input type="number" id="sodoan">
    <br><br>
    <button onclick="doanso()">Đoán</button>
    <p id="ketqua"></p>

    <script>
        function doanso() {
            let userNum = parseInt(document.getElementById("sodoan").value);
            let compNum = Math.floor(Math.random() * 10) + 1;
            let kq = (userNum === compNum) ? "Thắng! Số máy chọn là: " + compNum : "Chưa may mắn! Số máy chọn là: " + compNum;
            document.getElementById("ketqua").innerHTML = kq;
        }
    </script>
</body>
</html>
