<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Chuong Trinh Tinh Tuoi</h2>
    <label for="">Nhap vao nam sinh cua ban</label>
    <input type="number" id="namsinh">
    <br><br>
    <button onclick="tinhtuoi()">Tinh Tuoi</button>
    <p id="ketqua"></p>

    <script>
        // viet code javascript o day
        function tinhtuoi() {
            let yourBirth = document.getElementById("namsinh").value;
            let currentYear = new Date().getFullYear();
            let tuoi = currentYear - yourBirth;
            document.getElementById("ketqua").innerHTML = "Tuoi cua ban la: " + tuoi;
        }
    </script>
</body>
</html>
