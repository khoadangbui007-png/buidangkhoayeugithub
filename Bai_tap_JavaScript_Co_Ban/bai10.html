<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>May Tinh Don Gian</h2>
    <input type="number" id="num1"><br><br>
    <input type="number" id="num2"><br><br>
    <button onclick="tinh('+')">Cộng</button>
    <button onclick="tinh('-')">Trừ</button>
    <button onclick="tinh('*')">Nhân</button>
    <button onclick="tinh('/')">Chia</button>
    <p id="ketqua"></p>

    <script>
        function tinh(op) {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);
            let kq;
            if (op === '+') kq = a + b;
            else if (op === '-') kq = a - b;
            else if (op === '*') kq = a * b;
            else if (op === '/') kq = (b === 0) ? "Không thể chia cho 0" : a / b;
            document.getElementById("ketqua").innerHTML = "Kết quả: " + kq;
        }
    </script>
</body>
</html>
