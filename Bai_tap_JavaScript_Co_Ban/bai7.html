<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tro Choi Xuc Xac May Man</h2>
    <button onclick="lac()">Lắc xúc xắc</button>
    <p id="ketqua"></p>

    <script>
        function lac() {
            let kq = Math.floor(Math.random() * 6) + 1;
            document.getElementById("ketqua").innerHTML = "Kết quả xúc xắc: " + kq;
        }
    </script>
</body>
</html>
