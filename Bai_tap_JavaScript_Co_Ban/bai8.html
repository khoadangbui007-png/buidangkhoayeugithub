<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuong Trinh Du Doan Nghe Nghiep</h2>
    <label>Nhập tên của bạn:</label>
    <input type="text" id="hoten">
    <br><br>
    <button onclick="dudoan()">Dự đoán</button>
    <p id="ketqua"></p>

    <script>
        function dudoan() {
            let name = document.getElementById("hoten").value;
            let jobs = ["Lập trình viên", "Bác sĩ", "Giáo viên", "Doanh nhân", "Kỹ sư", "Đầu bếp"];
            let job = jobs[Math.floor(Math.random() * jobs.length)];
            document.getElementById("ketqua").innerHTML = name + " có tương lai làm nghề: " + job;
        }
    </script>
</body>
</html>
